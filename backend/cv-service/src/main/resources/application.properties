spring.application.name=cv-service
server.port=${SERVER_PORT_CV}
spring.datasource.url=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.schemas=cv
spring.flyway.default-schema=cv
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

file.upload-dir=/app/uploads/cvs
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB